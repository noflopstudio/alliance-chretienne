<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bienvenue - Alliance Chrétienne</title>
    <meta name="description" content="Alliance Chrétienne est une plateforme de rencontres chrétiennes permettant aux célibataires chrétiens de faire connaissance, échanger et construire des relations fondées sur la foi et les valeurs chrétiennes.">

 <link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/images/icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/images/icon-192.png">
<link rel="apple-touch-icon" sizes="192x192" href="/images/icon-192.png">
    <link rel="stylesheet" href="css/style.css">

    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        html,
        body {
            width: 100%;
            min-width: 100%;
            height: 100%;
            min-height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        body {
            font-family:
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                sans-serif;

            background: #0f172a;
        }


        /* =========================================================
           PAGE PLEIN ÉCRAN
        ========================================================= */

        .welcome-screen {
            position: relative;

            width: 100vw;
            height: 100vh;
            height: 100dvh;

            min-height: 100vh;
            min-height: 100dvh;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;

            background:
                linear-gradient(
                    135deg,
                    #172554 0%,
                    #1e3a8a 35%,
                    #4c1d95 68%,
                    #831843 100%
                );
        }


        /* =========================================================
           LUMIÈRES ANIMÉES
        ========================================================= */

        .light {
            position: absolute;

            border-radius: 50%;

            filter: blur(5px);

            pointer-events: none;

            opacity: 0.55;

            animation:
                floatingLight 10s ease-in-out infinite;
        }


        .light-one {
            width: 420px;
            height: 420px;

            top: -180px;
            left: -120px;

            background:
                radial-gradient(
                    circle,
                    rgba(59, 130, 246, 0.7),
                    transparent 70%
                );
        }


        .light-two {
            width: 380px;
            height: 380px;

            right: -120px;
            bottom: -140px;

            background:
                radial-gradient(
                    circle,
                    rgba(236, 72, 153, 0.65),
                    transparent 70%
                );

            animation-delay: -3s;
        }


        .light-three {
            width: 260px;
            height: 260px;

            right: 18%;
            top: 12%;

            background:
                radial-gradient(
                    circle,
                    rgba(139, 92, 246, 0.4),
                    transparent 70%
                );

            animation-delay: -6s;
        }


        @keyframes floatingLight {

            0%,
            100% {
                transform: translate3d(0, 0, 0) scale(1);
            }

            50% {
                transform: translate3d(25px, -25px, 0) scale(1.08);
            }

        }


        /* =========================================================
           PETITES PARTICULES
        ========================================================= */

        .particles {
            position: absolute;

            inset: 0;

            overflow: hidden;

            pointer-events: none;
        }


        .particle {
            position: absolute;

            width: 5px;
            height: 5px;

            border-radius: 50%;

            background: rgba(255, 255, 255, 0.6);

            animation:
                particleFloat 8s linear infinite;
        }


        .particle:nth-child(1) {
            left: 12%;
            bottom: -20px;
            animation-delay: 0s;
        }

        .particle:nth-child(2) {
            left: 28%;
            bottom: -20px;
            animation-delay: 2s;
        }

        .particle:nth-child(3) {
            left: 48%;
            bottom: -20px;
            animation-delay: 4s;
        }

        .particle:nth-child(4) {
            left: 68%;
            bottom: -20px;
            animation-delay: 1s;
        }

        .particle:nth-child(5) {
            left: 84%;
            bottom: -20px;
            animation-delay: 5s;
        }


        @keyframes particleFloat {

            0% {
                transform: translateY(0);
                opacity: 0;
            }

            15% {
                opacity: 0.8;
            }

            85% {
                opacity: 0.5;
            }

            100% {
                transform: translateY(-110vh);
                opacity: 0;
            }

        }


        /* =========================================================
           CONTENU
        ========================================================= */

        .welcome-content-wrapper {
            position: relative;

            z-index: 10;

            width: 100%;
            max-width: 720px;

            padding: 30px;

            display: flex;
            justify-content: center;

            animation:
                welcomeAppear 1s
                cubic-bezier(0.16, 1, 0.3, 1)
                forwards;
        }


        @keyframes welcomeAppear {

            from {
                opacity: 0;
                transform:
                    translateY(35px)
                    scale(0.96);
            }

            to {
                opacity: 1;
                transform:
                    translateY(0)
                    scale(1);
            }

        }


        /* =========================================================
           CARTE
        ========================================================= */

        .welcome-card {

            position: relative;

            width: 100%;

            padding: 45px 50px;

            text-align: center;

            border-radius: 32px;

            background:
                rgba(255, 255, 255, 0.93);

            border:
                1px solid rgba(255, 255, 255, 0.7);

            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.28);

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            overflow: hidden;
        }


        .welcome-card::before {

            content: "";

            position: absolute;

            width: 220px;
            height: 220px;

            top: -120px;
            right: -100px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(59, 130, 246, 0.12),
                    transparent 70%
                );

        }


        .welcome-card::after {

            content: "";

            position: absolute;

            width: 180px;
            height: 180px;

            bottom: -100px;
            left: -70px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(236, 72, 153, 0.1),
                    transparent 70%
                );

        }


        /* =========================================================
           LOGO
        ========================================================= */

        .welcome-brand {

            position: relative;

            z-index: 2;

            margin-bottom: 22px;

            font-size: 0.82rem;

            font-weight: 800;

            letter-spacing: 2px;

            text-transform: uppercase;

            background:
                linear-gradient(
                    90deg,
                    #2563eb,
                    #7c3aed,
                    #db2777
                );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;

            background-size: 200% auto;

            animation:
                brandGradient 4s linear infinite;
        }


        @keyframes brandGradient {

            to {
                background-position: 200% center;
            }

        }


        /* =========================================================
           PHOTO
        ========================================================= */

        .welcome-avatar-wrapper {

            position: relative;

            z-index: 2;

            width: 150px;
            height: 150px;

            margin: 0 auto 25px;

            display: flex;

            align-items: center;
            justify-content: center;
        }


        .welcome-avatar-ring {

            position: absolute;

            inset: -7px;

            border-radius: 50%;

            background:
                conic-gradient(
                    from 0deg,
                    #2563eb,
                    #7c3aed,
                    #db2777,
                    #2563eb
                );

            animation:
                rotateRing 5s linear infinite;
        }


        @keyframes rotateRing {

            to {
                transform: rotate(360deg);
            }

        }


        .welcome-avatar-ring::after {

            content: "";

            position: absolute;

            inset: 3px;

            border-radius: 50%;

            background: #ffffff;
        }


        .welcome-avatar {

            position: relative;

            z-index: 2;

            width: 150px;
            height: 150px;

            border-radius: 50%;

            object-fit: cover;

            border: 5px solid #ffffff;

            background: #e2e8f0;

            box-shadow:
                0 15px 35px rgba(0, 0, 0, 0.2);

            display: block;
        }


        /* =========================================================
           PETIT INDICATEUR
        ========================================================= */

        .online-dot {

            position: absolute;

            z-index: 5;

            right: 4px;
            bottom: 7px;

            width: 22px;
            height: 22px;

            border-radius: 50%;

            background: #22c55e;

            border: 4px solid #ffffff;

            box-shadow:
                0 0 0 5px rgba(34, 197, 94, 0.15);

            animation:
                onlinePulse 2s ease-in-out infinite;
        }


        @keyframes onlinePulse {

            0%,
            100% {
                box-shadow:
                    0 0 0 4px rgba(34, 197, 94, 0.15);
            }

            50% {
                box-shadow:
                    0 0 0 9px rgba(34, 197, 94, 0.04);
            }

        }


        /* =========================================================
           TEXTE
        ========================================================= */

        .welcome-title {

            position: relative;

            z-index: 2;

            margin: 0;

            color: #0f172a;

            font-size: clamp(
                2rem,
                5vw,
                3rem
            );

            line-height: 1.15;

            font-weight: 850;

            letter-spacing: -1px;
        }


        .welcome-title span {

            display: inline-block;

            margin-top: 5px;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #7c3aed,
                    #db2777
                );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;

            background-size: 200% auto;

            animation:
                nameGradient 4s ease infinite;
        }


        @keyframes nameGradient {

            0%,
            100% {
                background-position: 0% center;
            }

            50% {
                background-position: 100% center;
            }

        }


        .welcome-text {

            position: relative;

            z-index: 2;

            max-width: 550px;

            margin: 18px auto 0;

            color: #64748b;

            font-size: 1rem;

            line-height: 1.7;
        }


        /* =========================================================
           BOUTON
        ========================================================= */

        .welcome-actions {

            position: relative;

            z-index: 2;

            width: 100%;

            margin-top: 28px;
        }


        .btn-discover {

            position: relative;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 10px;

            width: 100%;

            min-height: 58px;

            padding: 1rem 1.5rem;

            border-radius: 17px;

            text-decoration: none;

            color: #ffffff;

            font-size: 1rem;

            font-weight: 750;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #7c3aed,
                    #db2777
                );

            background-size: 200% 200%;

            box-shadow:
                0 12px 30px rgba(99, 102, 241, 0.3);

            overflow: hidden;

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease;

            animation:
                buttonGradient 5s ease infinite;
        }


        @keyframes buttonGradient {

            0%,
            100% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

        }


        .btn-discover::before {

            content: "";

            position: absolute;

            top: 0;
            left: -120%;

            width: 70%;
            height: 100%;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255, 255, 255, 0.28),
                    transparent
                );

            transform: skewX(-20deg);

            animation:
                buttonShine 3.5s ease-in-out infinite;
        }


        @keyframes buttonShine {

            0% {
                left: -120%;
            }

            45%,
            100% {
                left: 140%;
            }

        }


        .btn-discover:hover {

            transform: translateY(-3px);

            box-shadow:
                0 18px 40px rgba(99, 102, 241, 0.4);
        }


        .btn-discover:active {

            transform: scale(0.98);
        }


        /* =========================================================
           PETITE PHRASE
        ========================================================= */

        .welcome-footer {

            position: relative;

            z-index: 2;

            margin-top: 20px;

            color: #94a3b8;

            font-size: 0.78rem;

            letter-spacing: 0.2px;
        }


        /* =========================================================
           MOBILE
        ========================================================= */

        @media (max-width: 600px) {

            .welcome-content-wrapper {

                padding: 16px;
            }


            .welcome-card {

                padding: 32px 20px;

                border-radius: 26px;
            }


            .welcome-avatar-wrapper {

                width: 125px;
                height: 125px;

                margin-bottom: 22px;
            }


            .welcome-avatar {

                width: 125px;
                height: 125px;
            }


            .welcome-title {

                font-size: 2rem;
            }


            .welcome-text {

                font-size: 0.92rem;

                line-height: 1.65;

                margin-top: 14px;
            }


            .welcome-actions {

                margin-top: 23px;
            }


            .btn-discover {

                min-height: 54px;

                font-size: 0.95rem;
            }


            .welcome-brand {

                font-size: 0.72rem;

                margin-bottom: 18px;
            }


            .welcome-footer {

                font-size: 0.72rem;
            }

        }


        /* =========================================================
           TRÈS PETITS TÉLÉPHONES
        ========================================================= */

        @media (max-width: 380px) {

            .welcome-content-wrapper {

                padding: 10px;
            }


            .welcome-card {

                padding: 25px 16px;

                border-radius: 22px;
            }


            .welcome-avatar-wrapper {

                width: 105px;
                height: 105px;

                margin-bottom: 18px;
            }


            .welcome-avatar {

                width: 105px;
                height: 105px;
            }


            .welcome-title {

                font-size: 1.7rem;
            }


            .welcome-text {

                font-size: 0.86rem;
            }

        }


        /* =========================================================
           ÉCRANS TRÈS HAUTS
        ========================================================= */

        @media (min-height: 850px) and (min-width: 601px) {

            .welcome-card {

                padding-top: 55px;
                padding-bottom: 55px;
            }

        }

    </style>
</head>


<body>

    <main class="welcome-screen">

        <!-- Lueurs animées -->
        <div class="light light-one"></div>
        <div class="light light-two"></div>
        <div class="light light-three"></div>


        <!-- Particules -->
        <div class="particles">

            <span class="particle"></span>
            <span class="particle"></span>
            <span class="particle"></span>
            <span class="particle"></span>
            <span class="particle"></span>

        </div>


        <!-- Contenu -->
        <div class="welcome-content-wrapper">

            <div class="welcome-card">


                <!-- Marque -->
                <div class="welcome-brand">
                    ✦ Alliance Chrétienne
                </div>


                <!-- Photo -->
                <div class="welcome-avatar-wrapper">

                    <div class="welcome-avatar-ring"></div>

                    <img
                        id="profileAvatar"
                        src=""
                        alt="Photo de profil"
                        class="welcome-avatar"
                    >

                    <div class="online-dot"></div>

                </div>


                <!-- Texte -->
                <h1 class="welcome-title">

                    Bienvenue,

                    <br>

                    <span id="profileName">...</span>

                </h1>


                <p class="welcome-text">

                    Nous sommes heureux de vous retrouver.
                    Découvrez de nouvelles personnes, partagez votre foi
                    et laissez peut-être une belle rencontre commencer.

                </p>


                <!-- Action -->
                <div class="welcome-actions">

                    <a
                        href="search.html"
                        class="btn-discover"
                    >
                        <span>🔍</span>

                        <span>
                            Découvrir les membres
                        </span>

                        <span>→</span>
                    </a>

                </div>


                <!-- Petit texte -->
                <div class="welcome-footer">

                    Des rencontres chrétiennes fondées sur la foi et les valeurs.

                </div>

            </div>

        </div>

    </main>


    <!-- =========================================================
         SCRIPTS
    ========================================================= -->

    <script src="js/i18n.js"></script>

    <script src="js/supabase-config.js"></script>

    <script src="js/profile.js"></script>


    <!-- =========================================================
         SERVICE WORKER
    ========================================================= -->

    <script>

        if ('serviceWorker' in navigator) {

            window.addEventListener('load', () => {

                navigator.serviceWorker
                    .register('/service-worker.js')
                    .then(registration => {

                        console.log(
                            '✅ Service Worker enregistré :',
                            registration.scope
                        );

                    })
                    .catch(error => {

                        console.error(
                            '❌ Erreur Service Worker :',
                            error
                        );

                    });

            });

        }

    </script>

</body>
</html>
